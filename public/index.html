<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AlertBukavu — Alertes en cours</title>
  <link rel="icon" type="image/png" href="logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 48}
    body{padding-bottom:80px}
  </style>
</head>
<body>

  <header class="top-bar">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="logo.png" alt="Logo" style="width:28px;height:28px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'"/>
      <h1 style="font-size:18px;font-weight:800;color:white;">AlertBukavu</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:100px;">
        <span class="live-dot"></span>
        <span style="color:white;font-size:11px;font-weight:700;">EN DIRECT</span>
      </div>
      <img id="headerAvatar" src="" alt="" style="width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;object-fit:cover;" onclick="window.location.href='profil.html'"/>
    </div>
  </header>

  <section class="hero-section">
    <h2>Alertes en cours</h2>
    <p style="display:flex;align-items:center;gap:8px;">
      <span class="live-dot"></span>
      <span id="compteurLabel">Chargement...</span>
    </p>
  </section>

  <!-- Filtres -->
  <div style="position:sticky;top:60px;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #ddb8b6;box-shadow:0 2px 8px rgba(132,0,21,.05);">
    <div style="display:flex;gap:8px;overflow-x:auto;padding:12px 16px;" class="no-scrollbar">
      <button class="pill active" onclick="filtrer(this,'tous')">Toutes</button>
      <button class="pill" onclick="filtrer(this,'securite')">Sécurité</button>
      <button class="pill" onclick="filtrer(this,'eau')">Eau</button>
      <button class="pill" onclick="filtrer(this,'routes')">Routes</button>
      <button class="pill" onclick="filtrer(this,'sante')">Santé</button>
      <button class="pill" onclick="filtrer(this,'meteo')">Météo</button>
      <button class="pill" onclick="filtrer(this,'autre')">Autre</button>
    </div>
  </div>

  <main style="max-width:900px;margin:0 auto;padding:20px 16px;">
    <div id="alertesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">
      <div class="card" style="height:200px;"><div class="skeleton" style="height:100%;border-radius:12px;"></div></div>
      <div class="card" style="height:200px;"><div class="skeleton" style="height:100%;border-radius:12px;"></div></div>
    </div>
    <div id="emptyState" style="display:none;text-align:center;padding:64px 20px;">
      <div style="width:72px;height:72px;background:#ffdad8;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <span class="material-symbols-outlined" style="font-size:32px;color:#840015;">notifications_none</span>
      </div>
      <p style="font-weight:700;font-size:16px;color:#1a1a1a;margin-bottom:6px;">Aucune alerte</p>
      <p style="color:#5b403e;font-size:14px;">Soyez le premier à signaler un incident</p>
    </div>
  </main>

  <button class="fab" onclick="window.location.href='publier.html'" title="Publier une alerte">
    <span class="material-symbols-outlined" style="font-size:26px;color:white;">add_alert</span>
  </button>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><span class="material-symbols-outlined" style="font-size:22px;">rss_feed</span><span>Alertes</span></a>
    <a href="publier.html" class="nav-item"><span class="material-symbols-outlined ms-o" style="font-size:22px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;">add_alert</span><span>Publier</span></a>
    <a href="stats.html" class="nav-item"><span class="material-symbols-outlined ms-o" style="font-size:22px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;">analytics</span><span>Stats</span></a>
    <a href="profil.html" class="nav-item"><span class="material-symbols-outlined ms-o" style="font-size:22px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;">person</span><span>Profil</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script>
    let toutesAlertes = [], filtreActuel = 'tous';
    const user = AB.requireAuth();
    if (user) {
      const av = document.getElementById('headerAvatar');
      av.src = getPhotoUrl(user, 36);
      av.onerror = () => { av.src = genererAvatar(user.nom || 'U', 36); };
    }

    function filtrer(btn, cat) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtreActuel = cat;
      afficherAlertes();
    }

    function cardHTML(a, i) {
      const cat = CATEGORIES[a.categorie] || CATEGORIES.autre;
      const urg = URGENCES[a.urgence] || URGENCES.moyen;
      const urgClass = `urgence-${a.urgence || 'moyen'}`;
      const photoAuteur = getPhotoUrl({ photoUrl: a.photo_auteur, nom: a.auteur_nom }, 36);
      return `
      <div class="card card-anim ${urgClass}" style="animation-delay:${i*60}ms;">
        <div style="padding:16px 16px 12px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
            <span style="padding:3px 10px;border-radius:100px;font-size:10px;font-weight:700;background:${urg.bg};color:${urg.color};">${urg.label}</span>
            <span style="padding:3px 10px;border-radius:100px;font-size:10px;font-weight:700;background:${cat.bg};color:${cat.color};">${cat.label}</span>
            <span style="margin-left:auto;font-size:11px;color:#906f6d;">${tempsRelatif(a.created_at)}</span>
          </div>
          <h3 style="font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:6px;line-height:1.4;">${escHtml(a.titre)}</h3>
          <p style="font-size:13px;color:#5b403e;line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${escHtml(a.description)}</p>
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#906f6d;">
            <span style="display:flex;align-items:center;gap:4px;">
              <span class="material-symbols-outlined" style="font-size:14px;color:#840015;">location_on</span>
              ${escHtml(a.quartier || 'Bukavu')}
            </span>
            <span>${a.nb_confirmations || 0} confirmation${(a.nb_confirmations||0)>1?'s':''}</span>
          </div>
        </div>
        ${a.photo_url ? `<img src="${escHtml(a.photo_url)}" class="alerte-img" alt="Photo alerte" loading="lazy" onerror="this.style.display='none'"/>` : ''}
        <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;background:#faf8f7;border-top:1px solid #efecea;">
          <img src="${photoAuteur}" class="author-img" onerror="this.src='${genererAvatar(a.auteur_nom||'U',36)}'"/>
          <div style="flex:1;">
            <p style="font-size:13px;font-weight:700;color:#1a1a1a;line-height:1.2;">${escHtml(a.auteur_nom || 'Habitant')}</p>
            <p style="font-size:11px;color:#906f6d;">${a.auteur_username ? '@'+escHtml(a.auteur_username) : escHtml(a.auteur_quartier||'Bukavu')}</p>
          </div>
          ${a.statut === 'resolue' ? '<span style="font-size:10px;font-weight:700;background:#E6FAF5;color:#00C48C;padding:3px 10px;border-radius:100px;">RÉSOLUE</span>' : ''}
        </div>
        <div style="border-top:1px solid #efecea;padding:10px 16px;display:flex;gap:10px;">
          <button onclick="confirmer('${a.id}')" style="flex:1;padding:9px;border-radius:8px;border:none;background:#E6FAF5;color:#00C48C;font-size:12px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;">
            <span class="material-symbols-outlined" style="font-size:15px;">check_circle</span>Confirmer
          </button>
          <button onclick="signalerFausse('${a.id}','${a.user_id}')" style="padding:9px 14px;border-radius:8px;border:none;background:#ffdad8;color:#840015;font-size:12px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s;">
            <span class="material-symbols-outlined" style="font-size:15px;">flag</span>Signaler
          </button>
        </div>
      </div>`;
    }

    function afficherAlertes() {
      const liste = filtreActuel === 'tous' ? toutesAlertes : toutesAlertes.filter(a => a.categorie === filtreActuel);
      const grid = document.getElementById('alertesGrid');
      const empty = document.getElementById('emptyState');
      document.getElementById('compteurLabel').textContent = `${toutesAlertes.length} alerte${toutesAlertes.length>1?'s':''} active${toutesAlertes.length>1?'s':''}`;
      if (!liste.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      grid.innerHTML = liste.map(cardHTML).join('');
    }

    async function chargerAlertes() {
      try {
        const data = await AB.api('alertes');
        toutesAlertes = data.alertes || [];
        afficherAlertes();
      } catch(e) {
        document.getElementById('alertesGrid').innerHTML = '<p style="color:#906f6d;text-align:center;padding:32px;grid-column:1/-1;">Impossible de charger les alertes</p>';
      }
    }

    async function confirmer(id) {
      try {
        const data = await AB.api(`alertes/${id}/confirmer`, 'POST');
        showToast(data.message);
        chargerAlertes();
      } catch(e) { showToast(e.message, 'error'); }
    }

    async function signalerFausse(id, auteurId) {
      if (user && auteurId === user.id) { showToast('Vous ne pouvez pas signaler votre propre alerte', 'warning'); return; }
      const r = await showConfirm('Signaler cette alerte ?', 'Vous pensez que cette alerte est fausse ? Après 5 signalements, elle sera suspendue.', 'Oui, signaler', 'warning');
      if (!r.isConfirmed) return;
      try {
        const data = await AB.api(`alertes/${id}/signaler`, 'POST');
        showToast(data.message);
        chargerAlertes();
      } catch(e) { showToast(e.message, 'error'); }
    }

    chargerAlertes();
    setInterval(chargerAlertes, 30000);
    afficherMenuAdmin();
  </script>
</body>
</html>
