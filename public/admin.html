<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AlertBukavu — Administration</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
  body { padding-bottom:40px;background:#fcf9f8; }
  .tab-btn { padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid #e4bdbb;background:white;color:#5b403e;font-family:'Inter',sans-serif;transition:all .2s; }
  .tab-btn.active { background:#840015;color:white;border-color:#840015; }
  .alerte-row { background:white;border-radius:12px;border:1px solid #e4bdbb;padding:14px 16px;margin-bottom:10px; }
</style>
</head>
<body>

<header class="top-bar">
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="index.html" style="color:white;display:flex;align-items:center;">
      <span class="material-symbols-outlined" style="font-size:22px;color:white;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;">arrow_back</span>
    </a>
    <span class="material-symbols-outlined" style="font-size:20px;color:white;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 48;">admin_panel_settings</span>
    <h1 style="font-size:17px;font-weight:800;color:white;">Administration</h1>
  </div>
  <span style="background:rgba(255,255,255,.2);color:white;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:700;">ADMIN</span>
</header>

<section style="background:#840015;padding:16px 20px 36px;">
  <p style="font-size:13px;color:rgba(255,255,255,.8);">Gestion des alertes et des utilisateurs</p>
</section>

<main style="max-width:900px;margin:-20px auto 0;padding:0 16px 20px;position:relative;z-index:1;">

  <div id="accessDenied" style="display:none;text-align:center;padding:48px 20px;">
    <span class="material-symbols-outlined" style="font-size:48px;color:#e4bdbb;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 48;">lock</span>
    <p style="font-weight:700;font-size:16px;color:#1c1b1b;margin-top:12px;">Accès restreint</p>
    <p style="color:#5b403e;font-size:14px;margin-top:6px;">Vous n'avez pas les droits administrateur.</p>
    <a href="index.html" style="display:inline-block;margin-top:16px;padding:10px 24px;background:#840015;color:white;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none;">Retour</a>
  </div>

  <div id="adminContent" style="display:none;">
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
      <button class="tab-btn active" onclick="switchTab(this,'tabSignalees')">Signalées</button>
      <button class="tab-btn" onclick="switchTab(this,'tabToutes')">Toutes les alertes</button>
      <button class="tab-btn" onclick="switchTab(this,'tabUsers')">Utilisateurs</button>
    </div>

    <div id="tabSignalees">
      <div id="listSignalees"><div class="skeleton" style="height:80px;margin-bottom:12px;border-radius:12px;"></div></div>
    </div>
    <div id="tabToutes" style="display:none;">
      <div id="listToutes"><div class="skeleton" style="height:80px;border-radius:12px;"></div></div>
    </div>
    <div id="tabUsers" style="display:none;">
      <div id="listUsers"><div class="skeleton" style="height:80px;border-radius:12px;"></div></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="config.js"></script>
<script>
AB.requireAuth();

if (!AB.isAdmin()) {
  document.getElementById('accessDenied').style.display = 'block';
} else {
  document.getElementById('adminContent').style.display = 'block';
  chargerSignalees();
}

function switchTab(btn, id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['tabSignalees','tabToutes','tabUsers'].forEach(t => document.getElementById(t).style.display = t === id ? 'block' : 'none');
  if (id === 'tabToutes') chargerToutes();
  if (id === 'tabUsers') chargerUsers();
}

function renderAlerte(a, showSignal = false) {
  const cat = CATEGORIES[a.categorie] || CATEGORIES.autre;
  const urg = URGENCES[a.urgence] || URGENCES.moyen;
  const statutColor = a.statut === 'suspendue' ? '#840015' : a.statut === 'resolue' ? '#00C48C' : '#FF9F43';
  const statutBg = a.statut === 'suspendue' ? '#ffdad8' : a.statut === 'resolue' ? '#E6FAF5' : '#FFF5EC';
  return `<div class="alerte-row">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;">
          <span style="padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:${urg.bg};color:${urg.color};">${urg.label}</span>
          <span style="padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:${cat.bg};color:${cat.color};">${cat.label}</span>
          ${showSignal ? `<span style="padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:#ffdad8;color:#840015;">${a.nb_signalements||0} signalement${(a.nb_signalements||0)>1?'s':''}</span>` : ''}
        </div>
        <p style="font-size:14px;font-weight:700;color:#1c1b1b;margin-bottom:2px;">${escHtml(a.titre)}</p>
        <p style="font-size:12px;color:#906f6d;">${escHtml(a.quartier||'Bukavu')} • ${tempsRelatif(a.created_at)}</p>
      </div>
      <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:${statutBg};color:${statutColor};white-space:nowrap;">${a.statut}</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      ${a.statut !== 'suspendue' ? `<button onclick="changerStatut('${a.id}','suspendue')" style="padding:8px 14px;background:#ffdad8;color:#840015;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;">Suspendre</button>` : `<button onclick="changerStatut('${a.id}','active')" style="padding:8px 14px;background:#E6FAF5;color:#00C48C;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;">Restaurer</button>`}
      ${a.statut !== 'resolue' ? `<button onclick="changerStatut('${a.id}','resolue')" style="padding:8px 14px;background:#E6FAF5;color:#00C48C;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;">Marquer résolu</button>` : ''}
    </div>
  </div>`;
}

async function chargerSignalees() {
  try {
    const data = await AB.api('alertes');
    const signalees = (data.alertes || []).filter(a => (a.nb_signalements||0) >= 1).sort((a,b) => (b.nb_signalements||0)-(a.nb_signalements||0));
    document.getElementById('listSignalees').innerHTML = signalees.length
      ? signalees.map(a => renderAlerte(a, true)).join('')
      : '<p style="color:#906f6d;font-size:14px;text-align:center;padding:28px 0;">Aucune alerte signalée</p>';
  } catch(e) { showToast('Erreur de chargement', 'error'); }
}

async function chargerToutes() {
  try {
    const data = await AB.api('alertes');
    const alertes = data.alertes || [];
    document.getElementById('listToutes').innerHTML = alertes.length
      ? alertes.map(a => renderAlerte(a)).join('')
      : '<p style="color:#906f6d;font-size:14px;text-align:center;padding:28px 0;">Aucune alerte</p>';
  } catch(e) { showToast('Erreur de chargement', 'error'); }
}

async function chargerUsers() {
  try {
    const data = await AB.api('admin/users');
    const users = data.users || [];
    document.getElementById('listUsers').innerHTML = users.length ? users.map(u => `
      <div style="background:white;border-radius:12px;border:1px solid #e4bdbb;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;">
        <img src="${genererAvatar(u.nom||'U', 44)}" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;"/>
        <div style="flex:1;min-width:0;">
          <p style="font-size:14px;font-weight:700;color:#1c1b1b;">${escHtml(u.nom)}</p>
          <p style="font-size:12px;color:#906f6d;">${escHtml(u.email)} • ${u.role} • ${escHtml(u.quartier||'')}</p>
        </div>
        <button onclick="toggleBlock('${u.id}',${!u.est_bloque})" style="padding:6px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;background:${u.est_bloque?'#E6FAF5':'#ffdad8'};color:${u.est_bloque?'#00C48C':'#840015'};">
          ${u.est_bloque ? 'Débloquer' : 'Bloquer'}
        </button>
      </div>`).join('')
      : '<p style="color:#906f6d;text-align:center;padding:28px 0;">Aucun utilisateur</p>';
  } catch(e) { showToast('Erreur de chargement', 'error'); }
}

async function changerStatut(id, statut) {
  try {
    await AB.api(`alertes/${id}/statut`, 'PUT', { statut });
    showToast('Statut mis à jour');
    chargerSignalees();
    if (document.getElementById('tabToutes').style.display !== 'none') chargerToutes();
  } catch(e) { showToast(e.message, 'error'); }
}

async function toggleBlock(id, bloquer) {
  const r = await showConfirm(bloquer ? 'Bloquer cet utilisateur ?' : 'Débloquer ?', '', bloquer ? 'Oui, bloquer' : 'Débloquer', bloquer ? 'warning' : 'question');
  if (!r.isConfirmed) return;
  try {
    await AB.api(`admin/users/${id}/bloquer`, 'PUT', { est_bloque: bloquer });
    showToast(bloquer ? 'Utilisateur bloqué' : 'Utilisateur débloqué');
    chargerUsers();
  } catch(e) { showToast(e.message, 'error'); }
}
</script>
</body>
</html>
